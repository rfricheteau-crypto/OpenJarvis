[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-webrtc-poc"
version = "0.1.0"
description = "Isolated Pipecat SmallWebRTC prototype for Hermès voice conversation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "pydantic>=2.0",
  "uvicorn>=0.30",
  "aiortc>=1.14,<2",
  "pipecat-ai",
  "pipecat-ai-small-webrtc-prebuilt>=2.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_webrtc_poc"]
